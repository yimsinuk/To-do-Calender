<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="업무일정">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#534AB7">
<title>업무일정</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.44.0/tabler-icons.min.css">
<style>
:root{--bg:#fff;--bg2:#f5f5f7;--bg3:#ebebed;--text:#1a1a1a;--text2:#6e6e73;--text3:#aeaeb2;--border:rgba(0,0,0,0.1);--border2:rgba(0,0,0,0.18);--accent:#534AB7;--accent-bg:#EEEDFE;--accent-text:#3C3489;--r:12px;--rs:8px;}
@media(prefers-color-scheme:dark){:root{--bg:#1c1c1e;--bg2:#2c2c2e;--bg3:#3a3a3c;--text:#f2f2f7;--text2:#aeaeb2;--text3:#636366;--border:rgba(255,255,255,0.1);--border2:rgba(255,255,255,0.18);--accent-bg:#2d2a5e;--accent-text:#AFA9EC;}}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg2);color:var(--text);min-height:100vh;}
.app{max-width:480px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;background:var(--bg);}
.header{background:var(--bg);border-bottom:0.5px solid var(--border);padding:env(safe-area-inset-top,0) 0 0;position:sticky;top:0;z-index:50;}
.header-inner{padding:14px 16px 0;}
.header-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;}
.htitle{font-size:17px;font-weight:600;color:var(--text);}
.nav-tabs{display:flex;overflow-x:auto;scrollbar-width:none;}
.nav-tabs::-webkit-scrollbar{display:none;}
.nav-tab{padding:9px 14px;font-size:13px;font-weight:500;color:var(--text2);border-bottom:2px solid transparent;cursor:pointer;white-space:nowrap;flex-shrink:0;}
.nav-tab.active{color:var(--accent);border-bottom-color:var(--accent);}
.content{flex:1;overflow-y:auto;padding:12px 12px calc(env(safe-area-inset-bottom,0) + 12px);-webkit-overflow-scrolling:touch;}
/* CAL */
.cal-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;}
.cnbtn{background:none;border:0.5px solid var(--border2);border-radius:var(--rs);padding:7px 12px;cursor:pointer;color:var(--text2);font-size:13px;}
.cal-month-label{font-size:15px;font-weight:600;color:var(--text);}
.cal-grid{background:var(--bg);border:1.5px solid rgba(0,0,0,0.2);border-radius:var(--r);overflow:hidden;}
@media(prefers-color-scheme:dark){.cal-grid{border-color:rgba(255,255,255,0.25);}}
.cal-dow{display:grid;grid-template-columns:repeat(7,1fr);border-bottom:1.5px solid rgba(0,0,0,0.2);}
@media(prefers-color-scheme:dark){.cal-dow{border-bottom-color:rgba(255,255,255,0.25);}}
.cdow{text-align:center;padding:8px 2px;font-size:11px;font-weight:600;color:var(--text3);}
.cdow.sun{color:#E24B4A;}.cdow.sat{color:#378ADD;}
.cal-days{display:grid;grid-template-columns:repeat(7,1fr);grid-auto-rows:64px;align-items:stretch;}
.cday{height:64px;border-right:1px solid rgba(0,0,0,0.15);border-bottom:1px solid rgba(0,0,0,0.15);padding:4px 3px;cursor:pointer;overflow:hidden;background:var(--bg);}
@media(prefers-color-scheme:dark){.cday{border-right-color:rgba(255,255,255,0.15);border-bottom-color:rgba(255,255,255,0.15);}}
.cday:nth-child(7n){border-right:none;}
.cday:hover:not(.empty){filter:brightness(0.95);}
@media(prefers-color-scheme:dark){.cday:hover:not(.empty){filter:brightness(1.1);}}
.cday.empty{cursor:default;background:var(--bg2) !important;}
.cday.selected{background:var(--accent-bg) !important;}
.cday.selected{background:var(--accent-bg);}
.cday-num{font-size:12px;font-weight:500;color:var(--text);width:22px;height:22px;display:flex;align-items:center;justify-content:center;margin-bottom:2px;border-radius:50%;}
.cday.today .cday-num{background:var(--accent);color:#fff;}
.cday.sunday .cday-num{color:#E24B4A;}.cday.saturday .cday-num{color:#378ADD;}
.cday.today.sunday .cday-num,.cday.today.saturday .cday-num{color:#fff;}
.cday.selected .cday-num{outline:2px solid var(--accent);outline-offset:1px;}
.cday.today.selected .cday-num{outline:none;}
.ctag{font-size:9px;padding:1px 4px;border-radius:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;margin-bottom:1px;display:block;}
/* 인라인 날짜 상세 패널 */
.day-panel{background:var(--bg);border:1px solid rgba(0,0,0,0.12);border-radius:var(--r);margin-top:10px;overflow:hidden;}
@media(prefers-color-scheme:dark){.day-panel{border-color:rgba(255,255,255,0.15);}}
.day-panel-hd{padding:12px 14px;border-bottom:0.5px solid var(--border);display:flex;align-items:center;justify-content:space-between;}
.day-panel-title{font-size:15px;font-weight:700;color:var(--text);}
.day-panel-sub{font-size:12px;color:var(--text3);}
.day-panel-body{padding:10px 14px;}
.day-panel-footer{padding:10px 14px;border-top:0.5px solid var(--border);}
/* DETAIL */
.back-btn{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--accent);cursor:pointer;margin-bottom:14px;background:none;border:none;padding:0;font-weight:500;}
.detail-date{font-size:20px;font-weight:700;color:var(--text);margin-bottom:4px;}
.detail-sub{font-size:12px;color:var(--text3);margin-bottom:16px;}
.cat-section{margin-bottom:12px;}
.cat-hd{font-size:12px;font-weight:600;color:var(--text2);margin-bottom:6px;display:flex;align-items:center;gap:6px;text-transform:uppercase;letter-spacing:.3px;}
.cdot{width:7px;height:7px;border-radius:50%;flex-shrink:0;}
.task-row{display:flex;align-items:flex-start;gap:8px;padding:8px 10px;background:var(--bg);border:0.5px solid var(--border);border-radius:var(--rs);margin-bottom:5px;}
.tbadge{font-size:10px;padding:2px 7px;border-radius:10px;flex-shrink:0;margin-top:1px;font-weight:500;}
.ttext{font-size:13px;color:var(--text);line-height:1.5;flex:1;}
.tdel{background:none;border:none;cursor:pointer;color:var(--text3);font-size:15px;padding:0 0 0 4px;flex-shrink:0;}
.tdel:hover{color:#E24B4A;}
.go-week-btn{width:100%;padding:13px;background:var(--accent);color:#fff;border:none;border-radius:var(--r);font-size:14px;font-weight:600;cursor:pointer;margin-top:16px;display:flex;align-items:center;justify-content:center;gap:6px;}
/* WEEK */
.week-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;}
.week-label{font-size:14px;font-weight:600;color:var(--text);}
.dcard{background:var(--bg);border:0.5px solid var(--border);border-radius:var(--r);margin-bottom:8px;overflow:hidden;}
.dcard-hd{display:flex;align-items:center;gap:10px;padding:12px 14px;cursor:pointer;}
.dnum{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:600;flex-shrink:0;}
.dcard-info{flex:1;}
.dcard-name{font-size:13px;font-weight:600;color:var(--text);}
.dcard-cnt{font-size:11px;color:var(--text3);margin-top:2px;}
.dcard-bd{padding:4px 14px 12px;border-top:0.5px solid var(--border);}
.wtask{display:flex;align-items:flex-start;gap:8px;padding:7px 0;border-bottom:0.5px solid var(--border);}
.wtask:last-child{border-bottom:none;}
.wadd{width:100%;padding:8px;background:none;border:0.5px dashed var(--border2);border-radius:var(--rs);font-size:12px;color:var(--text3);cursor:pointer;margin-top:6px;}
/* MODAL */
.mfilter{margin-bottom:12px;}
.mtype-tabs{display:flex;gap:6px;margin-bottom:8px;flex-wrap:wrap;}
.mtype-btn{padding:6px 14px;border-radius:20px;font-size:12px;font-weight:500;cursor:pointer;border:0.5px solid var(--border2);background:var(--bg);color:var(--text2);}
.mtype-btn.active{background:var(--accent-bg);color:var(--accent-text);border-color:var(--accent);}
.mtag-filter{display:flex;gap:5px;flex-wrap:wrap;}
.tfc{padding:4px 10px;border-radius:20px;font-size:11px;font-weight:500;cursor:pointer;border:0.5px solid var(--border);background:var(--bg);color:var(--text2);}
/* 메모 썸네일 카드 */
.mthumb-card{background:var(--bg);border:0.5px solid var(--border);border-radius:var(--r);padding:12px 14px;margin-bottom:8px;cursor:pointer;display:flex;align-items:center;gap:12px;}
.mthumb-card:active{background:var(--bg2);}
.mthumb-icon{width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0;}
.mthumb-main{flex:1;min-width:0;}
.mthumb-title{font-size:14px;font-weight:600;color:var(--text);margin-bottom:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.mthumb-meta{display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
.mthumb-badge{font-size:10px;padding:2px 7px;border-radius:8px;font-weight:500;}
.mthumb-date{font-size:11px;color:var(--text3);}
.mthumb-tags{display:flex;gap:3px;margin-top:4px;flex-wrap:wrap;}
.mthumb-tag{font-size:10px;padding:1px 6px;border-radius:8px;font-weight:500;}
/* 메모 상세 */
.mdetail-header{display:flex;align-items:center;gap:10px;margin-bottom:16px;}
.mdetail-icon{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0;}
.mdetail-title{font-size:18px;font-weight:700;color:var(--text);flex:1;}
.mdetail-actions{display:flex;gap:6px;}
.mdetail-sec{background:var(--bg2);border-radius:var(--rs);padding:12px 14px;margin-bottom:8px;}
.mdetail-label{font-size:11px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px;}
.mdetail-val{font-size:14px;color:var(--text);line-height:1.6;}
.mcard{background:var(--bg);border:0.5px solid var(--border);border-radius:var(--r);padding:13px 14px;margin-bottom:8px;}
.mcard-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;}
.mtbadge{font-size:11px;padding:3px 9px;border-radius:10px;font-weight:500;}
.tc{background:#E1F5EE;color:#085041;}.to{background:#FAEEDA;color:#633806;}.te{background:#F1EFE8;color:#444441;}
.mdate{font-size:11px;color:var(--text3);}
.mperson{font-size:14px;font-weight:600;color:var(--text);margin-bottom:2px;}
.mphone{font-size:12px;color:var(--text2);margin-bottom:6px;}
.mbody{font-size:13px;color:var(--text);line-height:1.6;}
.mtags-row{display:flex;gap:5px;flex-wrap:wrap;margin-top:9px;}
.mtpill{font-size:11px;padding:3px 9px;border-radius:10px;font-weight:500;}
.medit{font-size:15px;color:var(--text3);background:none;border:none;cursor:pointer;padding:4px;}
.mdel-btn{font-size:15px;color:var(--text3);background:none;border:none;cursor:pointer;padding:4px;}
.mdel-btn:hover{color:#E24B4A;}
.fab-wrap{display:flex;justify-content:flex-end;margin-top:8px;position:sticky;bottom:calc(env(safe-area-inset-bottom,0) + 12px);}
.fab{background:var(--accent);color:#fff;border:none;border-radius:24px;padding:12px 20px;font-size:14px;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:6px;box-shadow:0 2px 12px rgba(83,74,183,.35);}
/* TIMELINE 간트 */
.tl-wrap{padding-bottom:8px;}
.tl-proj-card{background:var(--bg);border:0.5px solid var(--border);border-radius:var(--r);margin-bottom:10px;overflow:hidden;}
.tl-proj-summary{padding:13px 14px;cursor:pointer;}
.tl-proj-summary:active{background:var(--bg2);}
.tl-proj-top{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
.tl-pdot{width:10px;height:10px;border-radius:50%;flex-shrink:0;}
.tl-pname{font-size:14px;font-weight:600;color:var(--text);flex:1;}
.tl-pmeta{font-size:11px;color:var(--text3);}
.tl-pchev{font-size:15px;color:var(--text3);transition:transform .2s;}
/* 진행률 도넛 + 바 영역 */
.tl-visual{display:flex;align-items:center;gap:12px;margin-bottom:10px;}
.tl-donut-wrap{position:relative;width:52px;height:52px;flex-shrink:0;}
.tl-donut-wrap svg{transform:rotate(-90deg);}
.tl-donut-pct{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:var(--text);}
.tl-bars{flex:1;min-width:0;}
.tl-bar-row{margin-bottom:5px;}
.tl-bar-label{display:flex;justify-content:space-between;font-size:10px;color:var(--text2);margin-bottom:2px;}
.tl-bar-track{height:6px;background:var(--bg2);border-radius:3px;overflow:hidden;}
.tl-bar-fill{height:100%;border-radius:3px;transition:width .4s ease;}
/* 상태 칩 행 */
.tl-status-row{display:flex;gap:5px;flex-wrap:wrap;}
.tl-st-chip{font-size:10px;padding:3px 8px;border-radius:8px;font-weight:500;}
/* 상세 보기 */
.tl-detail-bd{border-top:0.5px solid var(--border);padding:10px 14px;}
.tlt-row{display:flex;align-items:flex-start;gap:10px;padding:9px 0;border-bottom:0.5px solid var(--border);}
.tlt-row:last-child{border-bottom:none;}
.tlt-info{flex:1;min-width:0;}
.tlt-name{font-size:13px;color:var(--text);margin-bottom:3px;}
.tlt-dates{font-size:11px;color:var(--text3);}
.tlt-st{font-size:11px;padding:4px 10px;border-radius:10px;white-space:nowrap;flex-shrink:0;cursor:pointer;font-weight:500;}
.st-ready{background:#F1EFE8;color:#5F5E5A;}.st-prep{background:#E6F1FB;color:#185FA5;}
.st-wip{background:#FAEEDA;color:#854F0B;}.st-done{background:#EAF3DE;color:#3B6D11;}
.tlt-del{background:none;border:none;cursor:pointer;color:var(--text3);font-size:15px;padding:0 0 0 4px;flex-shrink:0;}
.tlt-del:hover{color:#E24B4A;}
.tladd{width:100%;padding:8px;background:none;border:0.5px dashed var(--border2);border-radius:var(--rs);font-size:12px;color:var(--text3);cursor:pointer;margin-top:6px;}
.tlnew{width:100%;padding:12px;background:none;border:0.5px solid var(--border2);border-radius:var(--r);font-size:13px;font-weight:600;color:var(--accent);cursor:pointer;margin-top:4px;}
.modal-ov{position:fixed;inset:0;background:rgba(0,0,0,.4);display:flex;align-items:flex-end;justify-content:center;z-index:200;}
.modal-box{background:var(--bg);border-radius:20px 20px 0 0;padding:20px 16px calc(env(safe-area-inset-bottom,0) + 20px);width:100%;max-width:480px;max-height:90vh;overflow-y:auto;}
.modal-handle{width:40px;height:4px;background:var(--border2);border-radius:2px;margin:0 auto 16px;}
.modal-title{font-size:17px;font-weight:700;margin-bottom:16px;color:var(--text);}
.mf{margin-bottom:13px;}
.mf-label{font-size:12px;color:var(--text2);margin-bottom:5px;font-weight:500;}
.mf input,.mf textarea,.mf select{width:100%;font-family:inherit;font-size:14px;background:var(--bg2);border:0.5px solid var(--border);border-radius:var(--rs);padding:10px 12px;color:var(--text);outline:none;}
.mf input:focus,.mf textarea:focus,.mf select:focus{border-color:var(--accent);}
.mf textarea{resize:vertical;min-height:75px;}
.tag-sel{display:flex;gap:6px;flex-wrap:wrap;}
.tsel-btn{padding:5px 11px;border-radius:20px;font-size:12px;font-weight:500;cursor:pointer;border:0.5px solid var(--border2);background:none;color:var(--text2);}
.ctag-row{display:flex;gap:7px;margin-top:7px;}
.ctag-row input{flex:1;}
.ctag-row button{padding:0 14px;border-radius:var(--rs);font-size:13px;font-weight:600;cursor:pointer;border:0.5px solid var(--border2);background:none;color:var(--accent);white-space:nowrap;}
.tag-manage-btn{display:flex;align-items:center;gap:4px;margin-top:8px;padding:5px 0;font-size:12px;color:var(--text3);background:none;border:none;cursor:pointer;}
.tag-manage-btn:hover{color:var(--accent);}
.tag-manage-row{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:0.5px solid var(--border);}
.tag-manage-row:last-child{border-bottom:none;}
.tag-manage-pill{font-size:12px;font-weight:500;padding:4px 12px;border-radius:20px;flex:1;}
.tag-manage-edit{background:none;border:0.5px solid var(--border2);border-radius:var(--rs);padding:5px 10px;font-size:12px;color:var(--accent);cursor:pointer;}
.tag-manage-del{background:none;border:none;cursor:pointer;color:var(--text3);font-size:16px;padding:4px;}
.tag-manage-del:hover{color:#E24B4A;}
.tag-edit-row{display:flex;gap:6px;align-items:center;padding:8px 0;border-bottom:0.5px solid var(--border);}
.tag-edit-row input{flex:1;font-family:inherit;font-size:13px;background:var(--bg2);border:0.5px solid var(--accent);border-radius:var(--rs);padding:6px 10px;color:var(--text);outline:none;}
.tag-edit-save{background:var(--accent);color:#fff;border:none;border-radius:var(--rs);padding:6px 12px;font-size:12px;font-weight:600;cursor:pointer;}
.tag-edit-cancel{background:none;border:0.5px solid var(--border2);border-radius:var(--rs);padding:6px 10px;font-size:12px;color:var(--text2);cursor:pointer;}
.mactions{display:flex;gap:8px;margin-top:18px;}
.mactions button{flex:1;padding:13px;border-radius:var(--rs);font-size:15px;font-weight:600;cursor:pointer;}
.btn-c{background:var(--bg2);border:0.5px solid var(--border);color:var(--text2);}
.btn-s{background:var(--accent);color:#fff;border:none;}
.btn-danger{background:#FCEBEB;border:0.5px solid #F09595;color:#791F1F;}
.empty{text-align:center;padding:50px 0;color:var(--text3);font-size:14px;line-height:1.8;}
.today-badge{font-size:10px;background:var(--accent-bg);color:var(--accent-text);padding:1px 7px;border-radius:10px;margin-left:5px;font-weight:600;}
</style>
</head>
<body>
<div class="app" id="app">
  <div class="header">
    <div class="header-inner">
      <div class="header-top">
        <span class="htitle">업무일정</span>
      </div>
      <div class="nav-tabs" id="nav-tabs">
        <div class="nav-tab active" onclick="switchTab('month')"><i class="ti ti-calendar-month"></i> 월별</div>
        <div class="nav-tab" onclick="switchTab('week')"><i class="ti ti-calendar-week"></i> 주별</div>
        <div class="nav-tab" onclick="switchTab('timeline')"><i class="ti ti-chart-gantt"></i> 타임라인</div>
        <div class="nav-tab" onclick="switchTab('memo')"><i class="ti ti-notes"></i> 메모</div>
      </div>
    </div>
  </div>
  <div class="content" id="content"></div>
</div>
<div id="modal-area"></div>
<script>
const TODAY = (()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');})();
const DAY_NAMES=['일','월','화','수','목','금','토'];
const CAT_COLORS={'노사':'#1D9E75','경평':'#534AB7','세무조사':'#D85A30','4대보험':'#639922','직무급':'#D4537E','성과급':'#BA7517','조정수당':'#378ADD','총인건비':'#888780','감사':'#E24B4A','직무중심':'#0F6E56','기타':'#888780'};
const CAT_BG={'노사':'#E1F5EE','경평':'#EEEDFE','세무조사':'#FAECE7','4대보험':'#EAF3DE','직무급':'#FBEAF0','성과급':'#FAEEDA','조정수당':'#E6F1FB','총인건비':'#F1EFE8','감사':'#FCEBEB','직무중심':'#E1F5EE','기타':'#F1EFE8'};
const CAT_FG={'노사':'#085041','경평':'#3C3489','세무조사':'#993C1D','4대보험':'#27500A','직무급':'#72243E','성과급':'#633806','조정수당':'#0C447C','총인건비':'#5F5E5A','감사':'#791F1F','직무중심':'#085041','기타':'#444441'};
const DEFAULT_TAGS=['노사','경평','세무조사','성과급','조정수당','총인건비','감사','직무급','4대보험','직무중심'];
const TAG_PAL=[{bg:'#E1F5EE',fg:'#085041'},{bg:'#EEEDFE',fg:'#3C3489'},{bg:'#FAECE7',fg:'#993C1D'},{bg:'#EAF3DE',fg:'#27500A'},{bg:'#FBEAF0',fg:'#72243E'},{bg:'#FAEEDA',fg:'#633806'},{bg:'#E6F1FB',fg:'#0C447C'},{bg:'#F1EFE8',fg:'#5F5E5A'},{bg:'#FCEBEB',fg:'#791F1F'},{bg:'#E1F5EE',fg:'#085041'},{bg:'#FBEAF0',fg:'#72243E'},{bg:'#EAF3DE',fg:'#3B6D11'}];
function tagColor(t){const i=DEFAULT_TAGS.indexOf(t);if(i>=0)return TAG_PAL[i];let h=0;for(const c of t)h=(h*31+c.charCodeAt(0))%TAG_PAL.length;return TAG_PAL[h];}

function ld(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d;}catch(e){return d;}}
function sv(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}

let userTasks=ld('ut4',{});
let memos=ld('mm4',[]);
let customTags=ld('ct4',[...DEFAULT_TAGS]);
let projects=ld('pj4',[]);
function saveAll(){sv('ut4',userTasks);sv('mm4',memos);sv('pj4',projects);sv('ct4',customTags);}

let S={tab:'month',calYear:new Date().getFullYear(),calMonth:new Date().getMonth()+1,selectedDate:null,weekOffset:0,mTypeF:'전체',mTagF:'전체',tlOpen:{}};

function switchTab(tab){
  S.tab=tab;
  document.querySelectorAll('.nav-tab').forEach((el,i)=>el.classList.toggle('active',['month','week','timeline','memo'][i]===tab));
  render();
}

function getAllTasks(d){return[...(userTasks[d]||[])];}
function extractCats(tasks){
  const cats=new Set();
  tasks.forEach(t=>{
    const m=(t.text||t).match(/\(([^)]+)\)/);
    if(m)for(const c of Object.keys(CAT_COLORS)){if(m[1].includes(c)){cats.add(c);break;}}
    if((t.type==='urgent')||(typeof t==='string'&&t.startsWith('★')))cats.add('★마감');
  });
  return[...cats];
}
function getTaskType(t){
  if(t.type==='urgent')return 'urgent';
  if(t.type==='meeting')return 'meeting';
  return 'normal';
}
function taskDisplayText(t){return typeof t==='string'?t:t.text||'';}

function render(){
  const c=document.getElementById('content');
  if(S.tab==='month')c.innerHTML=renderMonth();
  else if(S.tab==='week')c.innerHTML=renderWeekView();
  else if(S.tab==='timeline')c.innerHTML=renderTimeline();
  else c.innerHTML=renderMemo();
}

function renderMonth(){
  const y=S.calYear,m=S.calMonth;
  const firstDay=new Date(y,m-1,1).getDay();
  const dim=new Date(y,m,0).getDate();
  let html=`<div class="cal-nav">
    <button class="cnbtn" onclick="changeMonth(-1)"><i class="ti ti-chevron-left"></i></button>
    <span class="cal-month-label">${y}년 ${m}월</span>
    <button class="cnbtn" onclick="changeMonth(1)"><i class="ti ti-chevron-right"></i></button>
  </div>
  <div class="cal-grid"><div class="cal-dow">`;
  ['일','월','화','수','목','금','토'].forEach((d,i)=>html+=`<div class="cdow${i===0?' sun':i===6?' sat':''}">${d}</div>`);
  html+=`</div><div class="cal-days">`;
  for(let i=0;i<firstDay;i++)html+=`<div class="cday empty"></div>`;
  for(let d=1;d<=dim;d++){
    const ds=`${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const dow=(firstDay+d-1)%7;
    const tasks=getAllTasks(ds);
    const isSelected=S.selectedDate===ds;
    let cls='cday';
    if(ds===TODAY)cls+=' today';
    if(dow===0)cls+=' sunday';
    if(dow===6)cls+=' saturday';
    if(isSelected)cls+=' selected';
    html+=`<div class="${cls}" onclick="selectDay('${ds}')"><div class="cday-num">${d}</div>`;
    const urgents=tasks.filter(t=>t.type==='urgent');
    const others=tasks.filter(t=>t.type!=='urgent');
    if(urgents.length)html+=`<div style="display:flex;align-items:center;gap:2px;margin-bottom:1px"><div style="width:5px;height:5px;border-radius:50%;background:#E24B4A;flex-shrink:0"></div><span style="font-size:8px;color:#E24B4A;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:calc(100% - 9px)">${urgents[0].thumbnail||urgents[0].text.slice(0,6)}</span></div>`;
    others.slice(0,2).forEach(t=>{
      const typeBg=t.type==='meeting'?'#E6F1FB':'var(--bg2)';
      const typeFg=t.type==='meeting'?'#185FA5':'var(--text2)';
      const thumb=t.thumbnail||t.text.slice(0,6);
      html+=`<div style="font-size:8px;padding:1px 3px;border-radius:4px;background:${typeBg};color:${typeFg};white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;margin-bottom:1px">${thumb}</div>`;
    });
    if(tasks.length>3)html+=`<div style="font-size:8px;color:var(--text3);padding-left:2px">+${tasks.length-3}</div>`;
    html+=`</div>`;
  }
  // 월말 빈 칸 채우기 (마지막 행 나머지)
  const totalCells = firstDay + dim;
  const trailingEmpty = totalCells % 7 === 0 ? 0 : 7 - (totalCells % 7);
  for(let i=0;i<trailingEmpty;i++){
    const trailDow=(totalCells+i)%7;
    const trailCls='cday empty'+(trailDow===0?' sunday':trailDow===6?' saturday':'');
    html+=`<div class="${trailCls}"></div>`;
  }
  html+=`</div></div>`;
  // 인라인 날짜 상세 패널
  if(S.selectedDate){
    html+=renderDayPanel(S.selectedDate);
  }
  return html;
}

function selectDay(ds){
  S.selectedDate = S.selectedDate===ds ? null : ds;
  S.expandedTask={};
  render();
  if(S.selectedDate){
    setTimeout(()=>{
      const panel=document.querySelector('.day-panel');
      if(panel) panel.scrollIntoView({behavior:'smooth',block:'nearest'});
    },50);
  }
}

function renderDayPanel(ds){
  const d=new Date(ds+' 00:00:00');
  const label=`${d.getMonth()+1}월 ${d.getDate()}일 (${DAY_NAMES[d.getDay()]})`;
  const tasks=getAllTasks(ds);
  const expanded=S.expandedTask||{};
  const grouped={};const urgents=[];const others=[];
  tasks.forEach((t,idx)=>{
    if(t.type==='urgent'){urgents.push({t,idx});return;}
    const m2=(t.text||'').match(/\(([^)]+)\)/);let done=false;
    if(m2)for(const cat of Object.keys(CAT_COLORS)){if(m2[1].includes(cat)){if(!grouped[cat])grouped[cat]=[];grouped[cat].push({t,idx});done=true;break;}}
    if(!done)others.push({t,idx});
  });

  function taskCard(t, idx, badgeHtml){
    const thumb=t.thumbnail||t.text||'';
    const isOpen=!!expanded[ds+'_'+idx];
    const hasContent=t.text&&t.text!==thumb;
    return`<div class="task-row" style="flex-direction:column;align-items:stretch;gap:0;padding:0;overflow:hidden;">
      <div style="display:flex;align-items:center;gap:8px;padding:8px 10px;cursor:${hasContent?'pointer':'default'}" onclick="${hasContent?`toggleTaskExpand('${ds}',${idx})`:''}">
        ${badgeHtml}
        <span class="ttext" style="${t.type==='urgent'?'font-weight:600':''}flex:1">${thumb}</span>
        ${hasContent?`<i class="ti ti-chevron-${isOpen?'up':'down'}" style="font-size:13px;color:var(--text3);flex-shrink:0"></i>`:''}
        <button class="tdel" onclick="event.stopPropagation();deleteTask('${ds}',${idx})" style="margin-left:${hasContent?'0':'auto'}"><i class="ti ti-trash"></i></button>
      </div>
      ${isOpen&&hasContent?`<div style="padding:0 10px 10px 10px;font-size:12px;color:var(--text2);line-height:1.6;border-top:0.5px solid var(--border);background:var(--bg2)">${t.text.replace(/\n/g,'<br>')}</div>`:''}
    </div>`;
  }

  let body='';
  if(urgents.length){
    body+=`<div class="cat-section"><div class="cat-hd"><div class="cdot" style="background:#E24B4A"></div>마감 / 중요</div>`;
    urgents.forEach(({t,idx})=>body+=taskCard(t,idx,`<span class="tbadge" style="background:#FCEBEB;color:#791F1F">★ 마감</span>`));
    body+=`</div>`;
  }
  Object.entries(grouped).forEach(([cat,items])=>{
    body+=`<div class="cat-section"><div class="cat-hd"><div class="cdot" style="background:${CAT_COLORS[cat]}"></div>${cat}</div>`;
    items.forEach(({t,idx})=>body+=taskCard(t,idx,`<span class="tbadge" style="background:${CAT_BG[cat]};color:${CAT_FG[cat]}">${cat}</span>`));
    body+=`</div>`;
  });
  if(others.length){
    body+=`<div class="cat-section"><div class="cat-hd"><div class="cdot" style="background:#888780"></div>기타</div>`;
    others.forEach(({t,idx})=>body+=taskCard(t,idx,''));
    body+=`</div>`;
  }
  if(!tasks.length) body+=`<div style="text-align:center;padding:20px 0;font-size:13px;color:var(--text3)">등록된 업무가 없어요</div>`;
  return`<div class="day-panel">
    <div class="day-panel-hd">
      <span class="day-panel-title">${label}</span>
      <span class="day-panel-sub">${tasks.length}개 업무</span>
    </div>
    <div class="day-panel-body">${body}</div>
    <div class="day-panel-footer">
      <button class="go-week-btn" style="margin-top:0" onclick="goToWeekOf('${ds}')"><i class="ti ti-calendar-week"></i> 주별 상세 보기 / 업무 추가</button>
    </div>
  </div>`;
}

function toggleTaskExpand(ds,idx){
  if(!S.expandedTask) S.expandedTask={};
  const key=ds+'_'+idx;
  S.expandedTask[key]=!S.expandedTask[key];
  render();
  setTimeout(()=>{const p=document.querySelector('.day-panel');if(p)p.scrollIntoView({behavior:'smooth',block:'nearest'});},50);
}

function openDayDetail(ds){selectDay(ds);}

function deleteTask(ds,idx){
  if(!userTasks[ds])return;
  userTasks[ds].splice(idx,1);
  saveAll();
  render();
  setTimeout(()=>{
    const panel=document.querySelector('.day-panel');
    if(panel) panel.scrollIntoView({behavior:'smooth',block:'nearest'});
  },50);
}

function backToMonth(){S.tab='month';S.selectedDate=null;document.querySelectorAll('.nav-tab').forEach((el,i)=>el.classList.toggle('active',i===0));render();}
function changeMonth(dir){S.calMonth+=dir;if(S.calMonth>12){S.calMonth=1;S.calYear++;}if(S.calMonth<1){S.calMonth=12;S.calYear--;}S.selectedDate=null;render();}
function goToWeekOf(ds){
  const d=new Date(ds+' 00:00:00'),td=new Date(TODAY+' 00:00:00');
  const sun=new Date(d);sun.setDate(d.getDate()-d.getDay());
  const tsun=new Date(td);tsun.setDate(td.getDate()-td.getDay());
  S.weekOffset=Math.round((sun-tsun)/(7*86400000));
  S.tab='week';document.querySelectorAll('.nav-tab').forEach((el,i)=>el.classList.toggle('active',i===1));render();
}

function getWeekDates(offset){
  const base=new Date(TODAY+' 00:00:00');
  const dow=base.getDay(); // 0=일, 6=토
  const sun=new Date(base);
  sun.setDate(base.getDate()-dow+offset*7);
  return Array.from({length:7},(_,i)=>{const d=new Date(sun);d.setDate(sun.getDate()+i);return d.toISOString().split('T')[0];});
}

function renderWeekView(){
  const dates=getWeekDates(S.weekOffset);
  const s=dates[0].slice(5).replace('-','/'),e=dates[6].slice(5).replace('-','/');
  let html=`<div class="week-nav">
    <button class="cnbtn" onclick="changeWeek(-1)"><i class="ti ti-chevron-left"></i></button>
    <span class="week-label">${s} – ${e}</span>
    <button class="cnbtn" onclick="changeWeek(1)"><i class="ti ti-chevron-right"></i></button>
  </div>`;
  dates.forEach((date)=>{
    const tasks=getAllTasks(date);
    const d=new Date(date+' 00:00:00');
    const dNum=d.getDate();
    const dow2=d.getDay();
    const dayName=DAY_NAMES[dow2];
    const isToday=date===TODAY;
    const isSun=dow2===0, isSat=dow2===6;
    const nameColor=isSun?'#E24B4A':isSat?'#378ADD':'var(--text)';
    html+=`<div class="dcard"><div class="dcard-hd" onclick="toggleDayCard(this)">
      <div class="dnum" style="background:${isToday?'var(--accent-bg)':isSun?'#FEF0EF':isSat?'#EEF4FD':'var(--bg2)'};color:${isToday?'var(--accent)':nameColor}">${dNum}</div>
      <div class="dcard-info">
        <div class="dcard-name" style="color:${nameColor}">${dayName}요일${isToday?'<span class="today-badge">오늘</span>':''}</div>
        <div class="dcard-cnt">${tasks.length}개 업무</div>
      </div>
      <i class="ti ti-chevron-down" style="font-size:15px;color:var(--text3);transition:transform .2s;${isToday?'transform:rotate(180deg)':''}"></i>
    </div>
    <div class="dcard-bd" style="display:${isToday?'block':'none'}">`;
    if(!tasks.length)html+=`<div style="font-size:13px;color:var(--text3);padding:8px 0">등록된 업무가 없어요</div>`;
    tasks.forEach((t,idx)=>{
      const type=getTaskType(t);
      const thumb=t.thumbnail||t.text||'';
      const hasContent=t.text&&t.text!==thumb;
      const isOpen=!!(S.weekExpanded&&S.weekExpanded[date+'_'+idx]);
      const m2=(t.text||'').match(/\(([^)]+)\)/);let cat=null;
      if(m2)for(const c of Object.keys(CAT_COLORS)){if(m2[1].includes(c)){cat=c;break;}}
      html+=`<div class="wtask" style="flex-direction:column;align-items:stretch;gap:0;padding:0;">
        <div style="display:flex;align-items:center;gap:8px;padding:7px 0;cursor:${hasContent?'pointer':'default'}" onclick="${hasContent?`toggleWeekExpand('${date}',${idx})`:''}">
          ${type==='urgent'?`<span style="font-size:11px;padding:2px 7px;border-radius:10px;flex-shrink:0;background:#FCEBEB;color:#791F1F;font-weight:500">★</span>`
           :cat?`<span style="font-size:11px;padding:2px 7px;border-radius:10px;flex-shrink:0;background:${CAT_BG[cat]};color:${CAT_FG[cat]};font-weight:500">${cat}</span>`:''}
          <span style="font-size:13px;color:var(--text);line-height:1.5;flex:1${type==='urgent'?';font-weight:600':''}">${thumb}</span>
          ${hasContent?`<i class="ti ti-chevron-${isOpen?'up':'down'}" style="font-size:13px;color:var(--text3);flex-shrink:0"></i>`:''}
          <button style="background:none;border:none;cursor:pointer;color:var(--text3);font-size:15px;padding:0 0 0 6px;flex-shrink:0;" onclick="event.stopPropagation();editWeekTask('${date}',${idx})"><i class="ti ti-pencil"></i></button>
          <button style="background:none;border:none;cursor:pointer;color:var(--text3);font-size:15px;padding:0 0 0 4px;flex-shrink:0;" onclick="event.stopPropagation();deleteWeekTask('${date}',${idx})"><i class="ti ti-trash"></i></button>
        </div>
        ${isOpen&&hasContent?`<div style="padding:4px 0 8px 0;font-size:12px;color:var(--text2);line-height:1.6;border-top:0.5px solid var(--border)">${t.text.replace(/\n/g,'<br>')}</div>`:''}
      </div>`;
    });
    html+=`<button class="wadd" onclick="openAddTask('${date}')"><i class="ti ti-plus"></i> 업무 추가</button>
    </div></div>`;
  });
  return html;
}

function deleteWeekTask(date,idx){
  if(!userTasks[date])return;
  userTasks[date].splice(idx,1);
  saveAll();render();
}

function toggleWeekExpand(date,idx){
  if(!S.weekExpanded)S.weekExpanded={};
  const key=date+'_'+idx;
  S.weekExpanded[key]=!S.weekExpanded[key];
  render();
}

function editWeekTask(date,idx){
  const t=(userTasks[date]||[])[idx];
  if(!t)return;
  const esc=s=>(s||'').replace(/"/g,'&quot;');
  showModal(`<div class="modal-ov" onclick="if(event.target===this)closeModal()"><div class="modal-box">
    <div class="modal-handle"></div>
    <div class="modal-title">업무 수정 (${date.slice(5).replace('-','/')})</div>
    <div class="mf"><div class="mf-label">썸네일 <span style="color:var(--text3);font-weight:400">(캘린더에 표시, 최대 6자)</span></div><input type="text" id="et-thumb" value="${esc(t.thumbnail||'')}" placeholder="예: 경평보고, 세무조사" maxlength="6"></div>
    <div class="mf"><div class="mf-label">업무 내용</div><textarea id="et-content" placeholder="업무 내용을 입력하세요...">${esc(t.text||'')}</textarea></div>
    <div class="mf"><div class="mf-label">구분</div><select id="et-type">
      <option value="normal"${t.type==='normal'?' selected':''}>일반</option>
      <option value="urgent"${t.type==='urgent'?' selected':''}>★ 마감/중요</option>
      <option value="meeting"${t.type==='meeting'?' selected':''}>회의/출장</option>
    </select></div>
    <div class="mactions"><button class="btn-c" onclick="closeModal()">취소</button><button class="btn-s" onclick="saveEditTask('${date}',${idx})">저장</button></div>
  </div></div>`);
}

function saveEditTask(date,idx){
  const thumb=document.getElementById('et-thumb').value.trim();
  const content=document.getElementById('et-content').value.trim();
  const type=document.getElementById('et-type').value;
  if(!content)return;
  if(!userTasks[date])userTasks[date]=[];
  userTasks[date][idx]={text:content,type,thumbnail:thumb||content.slice(0,6)};
  saveAll();closeModal();render();
}

function toggleDayCard(el){const b=el.nextElementSibling,ch=el.querySelector('.ti-chevron-down'),open=b.style.display!=='none';b.style.display=open?'none':'block';ch.style.transform=open?'':'rotate(180deg)';}
function changeWeek(dir){S.weekOffset+=dir;render();}

const STATUSES=[{k:'ready',l:'시작 전'},{k:'prep',l:'준비 중'},{k:'wip',l:'진행 중'},{k:'done',l:'완료'}];
const STCLS={ready:'st-ready',prep:'st-prep',wip:'st-wip',done:'st-done'};
const ST_COLOR={ready:'#aeaeb2',prep:'#378ADD',wip:'#BA7517',done:'#639922'};

function parseD(s){return new Date(s+' 00:00:00');}
function fmtD(s){return s.slice(5).replace('-','/');}

function renderTimeline(){
  let html=`<div class="tl-wrap">`;
  if(!projects.length)html+=`<div class="empty">프로젝트가 없어요<br><span style="font-size:12px">아래 버튼으로 추가하세요</span></div>`;
  projects.forEach((p,pi)=>{
    const open=S.tlOpen[p.id];
    const total=p.tasks.length;
    const doneN=p.tasks.filter(t=>t.status==='done').length;
    const wipN=p.tasks.filter(t=>t.status==='wip').length;
    const prepN=p.tasks.filter(t=>t.status==='prep').length;
    const readyN=total-doneN-wipN-prepN;
    const pct=total?Math.round(doneN/total*100):0;
    const r=20,cx=26,cy=26,circ=2*Math.PI*r;
    function arc(pct2,offset,color){if(pct2<=0)return'';return`<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${color}" stroke-width="6" stroke-dasharray="${pct2*circ} ${circ}" stroke-dashoffset="${-offset*circ}"/>`;}
    const donut=`<svg width="52" height="52" viewBox="0 0 52 52" style="transform:rotate(-90deg)">
      <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="var(--bg3)" stroke-width="6"/>
      ${arc(total?doneN/total:0, 0,'#639922')}
      ${arc(total?wipN/total:0, total?doneN/total:0,'#BA7517')}
      ${arc(total?prepN/total:0, total?(doneN+wipN)/total:0,'#378ADD')}
    </svg>`;
    let minD=null,maxD=null;
    p.tasks.forEach(t=>{const s2=parseD(t.start),e2=parseD(t.end);if(!minD||s2<minD)minD=s2;if(!maxD||e2>maxD)maxD=e2;});
    const totalMs=maxD&&minD&&maxD>minD?(maxD-minD):1;
    const bars=p.tasks.slice(0,4).map(t=>{
      const s2=parseD(t.start),e2=parseD(t.end);
      const left=minD?Math.max(0,(s2-minD)/totalMs*100):0;
      const width=Math.max(6,(e2-s2+86400000)/totalMs*100);
      return`<div class="tl-bar-row">
        <div class="tl-bar-label"><span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:72%">${t.name}</span><span>${fmtD(t.end)}</span></div>
        <div class="tl-bar-track"><div class="tl-bar-fill" style="margin-left:${left}%;width:${Math.min(width,100-left)}%;background:${ST_COLOR[t.status]}"></div></div>
      </div>`;
    }).join('');
    const chips=[{n:doneN,l:'완료',bg:'#EAF3DE',fg:'#3B6D11'},{n:wipN,l:'진행중',bg:'#FAEEDA',fg:'#854F0B'},{n:prepN,l:'준비중',bg:'#E6F1FB',fg:'#185FA5'},{n:readyN,l:'대기',bg:'#F1EFE8',fg:'#5F5E5A'}].filter(c=>c.n>0);
    html+=`<div class="tl-proj-card">
      <div class="tl-proj-summary" onclick="toggleProject('${p.id}')">
        <div class="tl-proj-top">

          <div class="tl-bars">${bars||`<div style="font-size:11px;color:var(--text3);padding:8px 0">과업을 추가하세요</div>`}</div>

        <div class="tl-status-row">
          ${chips.map(c=>`<span class="tl-st-chip" style="background:${c.bg};color:${c.fg}">${c.l} ${c.n}</span>`).join('')}
        </div>

    if(open){
      html+=`<div class="tl-detail-bd">`;
      p.tasks.forEach((t,ti)=>html+=`<div class="tlt-row">
        <div class="tlt-info">
          <div class="tlt-name">${t.name}</div>
          <div class="tlt-dates">${fmtD(t.start)} ~ ${fmtD(t.end)}</div>
          ${t.note?`<div style="font-size:11px;color:var(--text2);margin-top:3px;line-height:1.5">${t.note.replace(/\n/g,'<br>')}</div>`:''}
        </div>
        <div class="tlt-st ${STCLS[t.status]}" onclick="cycleStatus(${pi},${ti})">${STATUSES.find(s2=>s2.k===t.status).l}</div>
        <button style="background:none;border:none;cursor:pointer;color:var(--text3);font-size:15px;padding:0 0 0 4px;flex-shrink:0;" onclick="editTlTask(${pi},${ti})"><i class="ti ti-pencil"></i></button>
        <button class="tlt-del" onclick="deleteTlTask(${pi},${ti})"><i class="ti ti-trash"></i></button>

    }
    html+=`</div>`;
  });
  return html+`<button class="tlnew" onclick="openAddProject()"><i class="ti ti-plus"></i> 프로젝트 추가</button></div>`;
}

function moveProject(pi,dir){
  const ni=pi+dir;
  if(ni<0||ni>=projects.length)return;
  [projects[pi],projects[ni]]=[projects[ni],projects[pi]];
  saveAll();render();
}
function toggleProject(id){S.tlOpen[id]=!S.tlOpen[id];render();}
function cycleStatus(pi,ti){const o=['ready','prep','wip','done'];projects[pi].tasks[ti].status=o[(o.indexOf(projects[pi].tasks[ti].status)+1)%4];saveAll();render();}
function deleteTlTask(pi,ti){projects[pi].tasks.splice(ti,1);saveAll();render();}
function confirmDeleteProject(pi){
  showModal(`<div class="modal-ov" onclick="if(event.target===this)closeModal()"><div class="modal-box">
    <div class="modal-handle"></div><div class="modal-title">프로젝트 삭제</div>
    <p style="font-size:14px;color:var(--text2);margin-bottom:20px">'${projects[pi].name}' 프로젝트와 모든 과업이 삭제돼요.</p>
    <div class="mactions"><button class="btn-c" onclick="closeModal()">취소</button><button class="btn-danger" onclick="deleteProject(${pi})">삭제</button></div>
  </div></div>`);
}
function deleteProject(pi){projects.splice(pi,1);saveAll();closeModal();render();}

function getActiveMemoTags(){const s=new Set();memos.forEach(m=>(m.tags||[]).forEach(t=>s.add(t)));return[...s];}
function memoTypeIcon(type){return type==='통화'?'📞':type==='지시'?'📋':'📝';}
function memoTypeBg(type){return type==='통화'?'#E1F5EE':type==='지시'?'#FAEEDA':'#F1EFE8';}
function memoTypeFg(type){return type==='통화'?'#085041':type==='지시'?'#633806':'#444441';}

function renderMemo(){
  const activeTags=getActiveMemoTags();
  const tf=S.mTypeF,tagf=S.mTagF;
  let html=`<div class="mfilter"><div class="mtype-tabs">`;
  ['전체','통화','지시','기타'].forEach(t=>html+=`<button class="mtype-btn${tf===t?' active':''}" onclick="setMTypeF('${t}')">${t}</button>`);
  html+=`</div>`;
  if(activeTags.length){
    html+=`<div class="mtag-filter">`;
    ['전체',...activeTags].forEach(t=>{const {bg,fg}=tagColor(t);const isA=tagf===t;html+=`<div class="tfc" style="${isA?`background:${bg};color:${fg};border-color:${fg}`:''}" onclick="setMTagF('${t}')">${t}</div>`;});
    html+=`</div>`;
  }
  html+=`</div>`;
  let filtered=memos;
  if(tf!=='전체')filtered=filtered.filter(m=>m.type===tf);
  if(tagf!=='전체')filtered=filtered.filter(m=>(m.tags||[]).includes(tagf));
  if(!filtered.length)html+=`<div class="empty">작성된 메모가 없어요<br><span style="font-size:12px">아래 + 버튼으로 추가하세요</span></div>`;
  filtered.forEach(m=>{
    const idx=memos.indexOf(m);
    const icon=memoTypeIcon(m.type);
    const ibg=memoTypeBg(m.type);
    const title=m.thumbnail||(m.person||m.content||'메모').slice(0,16);
    html+=`<div class="mthumb-card" onclick="openMemoDetail(${idx})">
      <div class="mthumb-icon" style="background:${ibg}">${icon}</div>
      <div class="mthumb-main">
        <div class="mthumb-title">${title}</div>
        <div class="mthumb-meta">
          <span class="mthumb-badge" style="background:${ibg};color:${memoTypeFg(m.type)}">${m.type}</span>
          <span class="mthumb-date">${m.date}</span>
          ${m.person?`<span style="font-size:11px;color:var(--text2)">${m.person}</span>`:''}
        </div>
        ${(m.tags&&m.tags.length)?`<div class="mthumb-tags">${m.tags.slice(0,3).map(tag=>{const {bg,fg}=tagColor(tag);return`<span class="mthumb-tag" style="background:${bg};color:${fg}">${tag}</span>`;}).join('')}</div>`:''}
      </div>
      <i class="ti ti-chevron-right" style="font-size:14px;color:var(--text3);flex-shrink:0"></i>
    </div>`;
  });
  html+=`<div class="fab-wrap"><button class="fab" onclick="openAddMemo()"><i class="ti ti-plus"></i> 메모 추가</button></div>`;
  return html;
}

  <div class="mdetail-header">
    <div class="mdetail-icon" style="background:${ibg}">${icon}</div>
    <div class="mdetail-title">${title}</div>

      <button class="medit" onclick="editMemo(${S.memoDetailIdx})"><i class="ti ti-pencil"></i></button>
      <button class="mdel-btn" onclick="confirmDeleteMemo(${S.memoDetailIdx})"><i class="ti ti-trash"></i></button>
    </div>
  </div>`;
  const rows=[

    {l:'날짜',v:m.date},

    (m.tags&&m.tags.length)?{l:'태그',v:m.tags.map(tag=>{const {bg,fg}=tagColor(tag);return`<span style="background:${bg};color:${fg};padding:2px 8px;border-radius:8px;font-size:12px;font-weight:500;margin-right:4px">${tag}</span>`;}).join('')}:null,
  ].filter(Boolean);
  rows.forEach(r=>html+=`<div class="mdetail-sec"><div class="mdetail-label">${r.l}</div><div class="mdetail-val">${r.v}</div></div>`);

    <div class="modal-handle"></div><div class="modal-title">메모 삭제</div>
    <p style="font-size:14px;color:var(--text2);margin-bottom:20px">이 메모를 삭제할까요?</p>

function renderTagSelector(selected){
  return`<div class="tag-sel" id="tag-sel">${customTags.map(t=>{const {bg,fg}=tagColor(t);const on=selected.includes(t);return`<button class="tsel-btn${on?' on':''}" style="${on?`background:${bg};color:${fg};border-color:${fg}`:''}" onclick="toggleTagSel(this,'${t}')">${t}</button>`;}).join('')}</div>
  <div class="ctag-row"><input type="text" id="new-tag-input" placeholder="새 태그 입력..."><button onclick="addCustomTag()"><i class="ti ti-plus"></i> 추가</button></div>
  <button class="tag-manage-btn" onclick="openTagManager()"><i class="ti ti-settings" style="font-size:13px"></i> 태그 관리 (수정 / 삭제)</button>`;
}
function toggleTagSel(btn,tag){btn.classList.toggle('on');const {bg,fg}=tagColor(tag);if(btn.classList.contains('on')){btn.style.background=bg;btn.style.color=fg;btn.style.borderColor=fg;}else{btn.style.background='';btn.style.color='';btn.style.borderColor='';}}
function addCustomTag(){const inp=document.getElementById('new-tag-input'),val=inp.value.trim();if(!val||customTags.includes(val))return;customTags.push(val);saveAll();const sel=document.getElementById('tag-sel'),{bg,fg}=tagColor(val);const btn=document.createElement('button');btn.className='tsel-btn on';btn.style.background=bg;btn.style.color=fg;btn.style.borderColor=fg;btn.setAttribute('onclick',`toggleTagSel(this,'${val}')`);btn.textContent=val;sel.appendChild(btn);inp.value='';}
function getSelectedTags(){return[...document.querySelectorAll('.tsel-btn.on')].map(b=>b.textContent);}

function openTagManager(){renderTagManagerModal(-1);}
function renderTagManagerModal(editingIdx){
  const rows=customTags.map((t,i)=>{
    const {bg,fg}=tagColor(t);
    if(i===editingIdx)return`<div class="tag-edit-row"><input type="text" id="tag-edit-input" value="${t}" maxlength="10"><button class="tag-edit-save" onclick="saveTagEdit(${i})">저장</button><button class="tag-edit-cancel" onclick="renderTagManagerModal(-1)">취소</button></div>`;
    return`<div class="tag-manage-row"><span class="tag-manage-pill" style="background:${bg};color:${fg}">${t}</span><button class="tag-manage-edit" onclick="renderTagManagerModal(${i})"><i class="ti ti-pencil"></i> 수정</button><button class="tag-manage-del" onclick="confirmDeleteTag(${i})"><i class="ti ti-trash"></i></button></div>`;
  }).join('');
  showModal(`<div class="modal-ov" onclick="if(event.target===this)closeModal()"><div class="modal-box">
    <div class="modal-handle"></div><div class="modal-title">태그 관리</div>
    <div style="max-height:60vh;overflow-y:auto">${rows||'<div style="text-align:center;padding:20px;color:var(--text3);font-size:13px">등록된 태그가 없어요</div>'}</div>
    <div class="mactions" style="margin-top:16px"><button class="btn-c" onclick="closeModal()">닫기</button></div>
  </div></div>`);
}
function saveTagEdit(i){const val=document.getElementById('tag-edit-input').value.trim();if(!val)return;if(customTags.includes(val)&&customTags[i]!==val){alert('이미 존재하는 태그예요.');return;}const oldTag=customTags[i];customTags[i]=val;memos.forEach(m=>{if(m.tags){const ti=m.tags.indexOf(oldTag);if(ti>=0)m.tags[ti]=val;}});saveAll();renderTagManagerModal(-1);}
function confirmDeleteTag(i){const tag=customTags[i];const usedCount=memos.filter(m=>m.tags&&m.tags.includes(tag)).length;showModal(`<div class="modal-ov" onclick="if(event.target===this)closeModal()"><div class="modal-box"><div class="modal-handle"></div><div class="modal-title">태그 삭제</div><p style="font-size:14px;color:var(--text2);margin-bottom:${usedCount?'8px':'20px'}">'${tag}' 태그를 삭제할까요?</p>${usedCount?`<p style="font-size:12px;color:#E24B4A;margin-bottom:20px">${usedCount}개 메모에서 이 태그가 제거돼요.</p>`:''}<div class="mactions"><button class="btn-c" onclick="openTagManager()">취소</button><button class="btn-danger" onclick="deleteTag(${i})">삭제</button></div></div></div>`);}
function deleteTag(i){const tag=customTags[i];customTags.splice(i,1);memos.forEach(m=>{if(m.tags)m.tags=m.tags.filter(t=>t!==tag);});saveAll();openTagManager();}

function closeModal(){document.getElementById('modal-area').innerHTML='';}

    <div class="modal-handle"></div>
    <div class="modal-title">${isNew?'프로젝트 추가':'프로젝트 수정'}</div>
    <div class="mf"><div class="mf-label">프로젝트명</div><input type="text" id="ap-name" value="${esc(p.name)}" placeholder="프로젝트 이름을 입력하세요"></div>
    <div class="mf"><div class="mf-label">색상</div><select id="ap-color">
      ${colors.map(c=>`<option value="${c.v}"${p.color===c.v?' selected':''}>${c.l}</option>`).join('')}
    </select></div>
    <div class="mactions"><button class="btn-c" onclick="closeModal()">취소</button><button class="btn-s" onclick="saveProject(${pi})">저장</button></div>
  </div></div>`);
}
function openAddProject(){showProjectModal(-1);}
function editProject(pi){showProjectModal(pi);}
function saveProject(pi){
  const name=document.getElementById('ap-name').value.trim();
  const color=document.getElementById('ap-color').value;
  if(!name)return;
  if(pi<0) projects.push({id:'p'+Date.now(),name,color,tasks:[]});
  else {projects[pi].name=name; projects[pi].color=color;}
  saveAll();closeModal();render();
}

render();
</script>
</body>
</html>
